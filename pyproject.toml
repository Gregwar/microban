[project]
name = "microban"
version = "0.0.2"
description = "Microban project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "onnxruntime>=1.26.0",
    "placo>=0.9.23",
    "pollen_bmi088_imu_library==1.0.0rc1",
    "pyzmq",
    "rustypot>=1.4.2",
]

[dependency-groups]
sim = [
    "better-actuator-models",
    "mujoco>=3.8.1",
]
# Local-only tooling for the scripts in src/debug (never deployed: `sync` excludes them).
debug = [
    "matplotlib",
]

[tool.uv]
override-dependencies = [
    "numpy>=2.3",
]

[tool.uv.sources]
# If needed for debugging, using editable custom install of better-actuator-models:
better-actuator-models = { path = "/home/gregwar/bam", editable = true }
